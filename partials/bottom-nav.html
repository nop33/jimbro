<!-- Finishing a workout early asks first, with what is left of it. -->
<dialog id="finish-workout-dialog" class="dialog-sheet" aria-labelledby="finish-workout-title">
  <!-- partial:sheet-grabber -->
  <header class="dialog-sheet-header">
    <h2 id="finish-workout-title" class="text-xl font-bold focus:outline-none" tabindex="-1" autofocus>
      Finish workout?
    </h2>
  </header>
  <div class="dialog-sheet-body">
    <p class="text-jim-neutral">
      <span id="finish-workout-name"></span> · started <span id="finish-workout-started"></span>
      <span id="finish-workout-elapsed" class="font-bold tabular-nums"></span>
    </p>
    <p id="finish-workout-left" class="text-sm text-neutral-400"></p>
  </div>
  <footer class="dialog-sheet-footer">
    <a id="finish-workout-go" class="btn-secondary flex-1 text-center">Go to workout</a>
    <button type="button" id="finish-workout-confirm" class="btn-primary flex-1">Finish workout</button>
  </footer>
</dialog>
