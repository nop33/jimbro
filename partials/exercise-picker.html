<!-- The exercise picker, a full-height sheet that src/pages/ExercisePicker.ts fills: a search, a chip per section to
     filter by, and the exercises grouped by section. To add, each exercise has a checkbox and the footer adds the
     checked ones. To pick one, as a swap does, each exercise is a button and the footer hides. -->
<dialog id="exercise-picker" class="dialog-sheet" aria-labelledby="exercise-picker-title">
  <form id="exercise-picker-form" class="contents">
    <header class="dialog-sheet-header">
      <h2 id="exercise-picker-title" class="text-lg font-bold focus:outline-none" tabindex="-1" autofocus>
        Add exercises
      </h2>
      <!-- partial:close-dialog-button -->
    </header>
    <div class="dialog-sheet-body">
      <div class="exercise-picker-tools">
        <div class="search-field">
          <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input type="search" id="exercise-search" placeholder="Search exercises" aria-label="Search exercises" />
        </div>
        <div id="exercise-filter" class="exercise-filter" role="radiogroup" aria-label="Show"></div>
      </div>
      <div id="exercise-choices" class="flex flex-col gap-4">
        <!-- The exercises, by section -->
      </div>
      <p id="no-exercise-match" class="text-jim-neutral-secondary" hidden>No exercise matches.</p>
      <p id="no-section-exercises" class="text-jim-neutral-secondary" hidden>
        <span class="no-section-exercises-text"><!-- --></span>
        <a href="/exercises/" class="link-primary underline">Create one</a>
      </p>
      <p id="no-exercises" class="text-jim-neutral-secondary" hidden>
        You have no exercises yet. <a href="/exercises/" class="link-primary underline">Create one</a>
      </p>
    </div>
    <footer id="exercise-picker-footer" class="dialog-sheet-footer">
      <button type="submit" id="exercise-picker-submit" class="btn-primary w-full" disabled>Add exercises</button>
    </footer>
  </form>
</dialog>

<template id="exercise-filter-chip-template">
  <label class="exercise-filter-chip">
    <input type="radio" name="exercise-section" class="sr-only" />
    <span class="exercise-filter-chip-label"><!-- --></span>
  </label>
</template>

<template id="exercise-choice-group-template">
  <section class="exercise-choice-group">
    <h3 class="exercise-choice-group-title"><!-- --></h3>
    <div class="exercise-choice-list"></div>
  </section>
</template>

<template id="exercise-choice-template">
  <label class="exercise-choice">
    <span class="exercise-choice-text">
      <span class="exercise-choice-name"><!-- --></span>
      <span class="exercise-choice-muscle" hidden><!-- --></span>
    </span>
    <span class="exercise-choice-note"><!-- --></span>
    <input type="checkbox" name="exercise" />
  </label>
</template>

<template id="exercise-pick-template">
  <button type="button" class="exercise-choice">
    <span class="exercise-choice-text">
      <span class="exercise-choice-name"><!-- --></span>
      <span class="exercise-choice-muscle" hidden><!-- --></span>
    </span>
    <span class="exercise-choice-note"><!-- --></span>
  </button>
</template>
