<meta charset="UTF-8" />
<!-- viewport-fit=cover lets the page draw under the phone's home indicator and gesture bar, so the bottom nav reaches
     the screen's edge instead of stopping above a strip in the theme colour. The nav pads itself by the safe area. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<!-- The app is dark only. The browser paints a page's background before the page itself, as in the frames between a
     swipe back and the next tap, and this keeps that background dark instead of white. -->
<meta name="color-scheme" content="dark" />
<link rel="icon" href="/icons/favicon.ico" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/app.webmanifest" />
<!-- A stylesheet in the head blocks the first paint until it loads, so no page shows unstyled, in dev too. -->
<link rel="stylesheet" href="/src/style.css" />
<!-- Module scripts run in order once the page is parsed, so these can sit here, before each page's own script. The
     router mounts the page each page's script exports. -->
<script type="module" src="/src/navigation.ts"></script>
<script type="module" src="/src/features/hapticFeedback/index.ts"></script>
<script type="module" src="/src/router.ts"></script>
