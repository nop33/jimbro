<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- The app is dark only. The browser paints a page's background before the page itself, as in the frames between a
     swipe back and the next tap, and this keeps that background dark instead of white. -->
<meta name="color-scheme" content="dark" />
<link rel="icon" href="/icons/favicon.ico" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/app.webmanifest" />
<!-- A stylesheet in the head blocks the first paint until it loads, so no page shows unstyled, in dev too. -->
<link rel="stylesheet" href="/src/style.css" />
<!-- Chromium prerenders the other bottom-nav pages, so tapping one shows it complete at once. -->
<script type="speculationrules">
  {
    "prerender": [{ "where": { "selector_matches": ".bottom-nav a:not([aria-current])" }, "eagerness": "immediate" }]
  }
</script>
<!-- Module scripts run in order once the page is parsed, so these can sit here, before each page's own script. -->
<script type="module" src="/src/navigation.ts"></script>
<script type="module" src="/src/features/hapticFeedback/index.ts"></script>
