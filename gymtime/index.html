<!doctype html>
<html lang="en">
  <head>
    <!-- partial:head -->
    <title>Jimbro - Gymtime</title>
  </head>
  <body class="app">
    <div class="app-page pb-20 md:pb-0">
      <header class="app-header">
        <!-- partial:back-button -->
        <h1 class="app-header-title">
          <!-- Name of program -->
        </h1>
        <button id="delete-workout-session-btn" class="link-primary ml-auto font-semibold">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
            />
          </svg>
          Delete
        </button>
      </header>
      <div class="app-page-content gap-5">
        <!-- The day and gym the workout is done at, and its notes. The first change on the page starts the workout. -->
        <details id="workout-details">
          <summary aria-label="Workout details">
            <span class="workout-summary">
              <span class="workout-summary-item">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-5"
                  aria-hidden="true"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"
                  />
                </svg>
                <span id="workout-date-label"></span>
              </span>
              <span class="workout-summary-item min-w-0">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-5"
                  aria-hidden="true"
                >
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"
                  />
                </svg>
                <span id="workout-gym-label" class="truncate"></span>
              </span>
            </span>
          </summary>
          <form id="gymtime-form" class="flex flex-col gap-2">
            <div class="flex gap-2 w-full">
              <input type="date" name="date" value="" required aria-label="Date" class="w-auto shrink-0 px-3" />
              <div class="relative grow min-w-0">
                <input
                  class="peer pl-3 pr-11"
                  type="text"
                  name="location"
                  list="gym-options"
                  autocomplete="off"
                  placeholder="Type gym &amp; location"
                  aria-label="Gym"
                />
                <button
                  type="button"
                  id="clear-gym-btn"
                  class="absolute inset-y-0 right-0 flex items-center justify-center text-neutral-400 peer-placeholder-shown:hidden"
                  aria-label="Clear gym"
                  title="Clear gym"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-5"
                  >
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>
              <datalist id="gym-options"></datalist>
            </div>
            <textarea name="notes" placeholder="Notes" aria-label="Notes"></textarea>
          </form>
        </details>
        <div id="exercises-list" class="flex flex-col gap-2">
          <!-- Exercises will be rendered here -->
        </div>

        <section id="passkey-offer" class="card flex flex-col gap-3 mt-4" aria-labelledby="passkey-offer-title" hidden>
          <h2 id="passkey-offer-title" class="card-title">Back up your workouts</h2>
          <p class="text-jim-neutral-secondary">Create a passkey to keep a copy of your workouts in the cloud.</p>
          <div class="flex gap-2">
            <button type="button" id="passkey-offer-create" class="btn-primary flex-1 px-3 whitespace-nowrap">
              Create passkey
            </button>
            <button type="button" id="passkey-offer-dismiss" class="btn-secondary flex-1 px-3 whitespace-nowrap">
              Not now
            </button>
          </div>
          <button type="button" id="passkey-offer-sign-in" class="link-primary self-center text-sm">
            Already have a passkey? Sign in
          </button>
        </section>

        <div id="save-to-program-card" class="card card-pending card-clickable mt-16 hidden">
          <div class="flex items-center justify-center gap-1 h-16">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z"
              />
            </svg>
            <div class="text-center text-lg font-bold">Save to program</div>
          </div>
        </div>

        <div id="add-exercise-card" class="card card-pending card-clickable mt-2">
          <div class="flex items-center justify-center gap-1 h-16">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            <div class="text-center text-lg font-bold">Add exercise</div>
          </div>
        </div>

        <template id="workout-exercise-item-template">
          <div class="card">
            <header class="items-start gap-2">
              <div class="flex flex-1 min-w-0 flex-wrap items-center gap-x-2.5 gap-y-1">
                <h3 class="exercise-name card-title">
                  <!-- -->
                </h3>
                <span class="exercise-muscle badge">
                  <!-- -->
                </span>
                <span class="exercise-kind badge bg-jim-accent text-neutral-900 hidden"> </span>
              </div>
              <!-- A 44px button whose centre sits on the title's first line, however many lines the name takes.
                   It sits above the summary's tap area, which covers the header. -->
              <button
                type="button"
                class="exercise-actions-btn relative z-10 -my-2 -mr-3 flex items-center justify-center rounded-lg text-jim-accent cursor-pointer hover:bg-jim-accent/10 active:bg-jim-accent/20"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="2"
                  stroke="currentColor"
                  class="size-6"
                  aria-hidden="true"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM12.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM18.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"
                  />
                </svg>
              </button>
              <div popover class="exercise-actions-menu card-menu">
                <button type="button" class="move-up-workout-session-exercise-btn">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-5"
                  >
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
                  </svg>
                  Move up
                </button>
                <button type="button" class="move-down-workout-session-exercise-btn">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-5"
                  >
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                  </svg>
                  Move down
                </button>
                <button type="button" class="swap-workout-session-exercise-btn">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-5"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"
                    />
                  </svg>
                  Swap exercise
                </button>
                <button type="button" class="delete-workout-session-exercise-btn text-jim-accent">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-5"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
                    />
                  </svg>
                  Delete exercise
                </button>
              </div>
            </header>
            <details class="exercise-details">
              <summary>Exercise sets</summary>
              <div class="exercise-details-content">
                <div class="completed-sets set-list mb-3">
                  <!-- Completed sets will be rendered here -->
                </div>
                <!-- Under the last set, on the right. -->
                <div class="add-set-row">
                  <button type="button" class="add-set-btn">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="2.5"
                      stroke="currentColor"
                      class="size-[18px]"
                      aria-hidden="true"
                    >
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    Add set
                  </button>
                </div>
                <!-- Opens from a set still to do. -->
                <div popover class="set-menu card-menu">
                  <button type="button" class="remove-set-slot-btn text-jim-accent">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.5"
                      stroke="currentColor"
                      class="size-5"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
                      />
                    </svg>
                    <span class="remove-set-label">Remove set</span>
                  </button>
                </div>
                <div class="next-set mt-1">
                  <form class="next-set-form flex flex-col gap-4">
                    <div class="next-set-fields"></div>
                    <button type="submit" class="btn-primary text-white w-full py-5 text-lg">Finished set</button>
                  </form>
                </div>
                <div class="flex gap-2 w-full mt-4">
                  <button
                    type="button"
                    class="view-last-set-btn btn-secondary w-full px-3 text-sm whitespace-nowrap flex items-center justify-center gap-2"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.5"
                      stroke="currentColor"
                      class="size-5"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
                      />
                    </svg>
                    Previous sets
                  </button>
                  <button
                    type="button"
                    class="view-history-btn btn-secondary w-full px-3 text-sm whitespace-nowrap flex items-center justify-center gap-2"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.5"
                      stroke="currentColor"
                      class="size-5"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"
                      />
                    </svg>
                    View History
                  </button>
                </div>
              </div>
            </details>
          </div>
        </template>

        <template id="completed-set-item-template">
          <div class="set border rounded-md p-2">
            <div class="set-label text-jim-neutral-secondary whitespace-nowrap">
              Set <span class="set-number font-bold text-jim-accent"></span>
            </div>
            <div class="set-fields"></div>
          </div>
        </template>
      </div>
    </div>

    <dialog id="break-countdown-dialog">
      <div class="h-full w-full flex flex-col items-center justify-between">
        <p class="text-4xl font-bold hide-when-minimized"><span id="sets-done" class="text-jim-accent"></span> done.</p>
        <h2 id="countdown" class="text-[min(8rem,28vw)] leading-none font-bold font-mono">
          <!-- -->
        </h2>
        <div class="w-full flex flex-col gap-4 items-center hide-when-minimized">
          <p id="next-exercise-message" class="text-xl font-bold">
            Coming up: <span id="next-exercise-name" class="text-jim-accent"></span>
          </p>
          <div class="w-full flex items-center justify-between">
            <button
              id="minimize-break"
              type="button"
              class="flex items-center justify-center rounded-xl border border-neutral-600/50 p-3 transition-colors hover:bg-neutral-700 hover:text-white"
              aria-label="Minimize"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
              </svg>
            </button>
            <div class="flex items-center gap-2">
              <button
                id="view-history-break"
                type="button"
                aria-label="View exercise history"
                class="flex items-center justify-center rounded-xl border border-neutral-600/50 p-3 transition-colors hover:bg-neutral-700 hover:text-white"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="size-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"
                  />
                </svg>
              </button>
              <button id="skip-break" class="btn-secondary">Skip</button>
            </div>
          </div>
        </div>
      </div>
    </dialog>

    <dialog id="edit-set-dialog">
      <header class="flex justify-between items-center mb-4">
        <!-- showModal() focuses the autofocus element, so the title takes the focus and no field opens the keyboard. Only script can focus it, so it needs no focus ring. -->
        <h2 class="text-xl font-bold focus:outline-none" tabindex="-1" autofocus>Edit set</h2>
        <!-- partial:close-dialog-button -->
      </header>
      <form id="edit-set-form" class="flex flex-col gap-2">
        <div id="edit-set-fields"></div>
        <div class="flex gap-3 justify-end mt-6">
          <!-- partial:delete-button -->
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="last-set-dialog">
      <header class="flex justify-between items-start mb-4">
        <h2 class="text-xl font-bold">Previous sets</h2>
        <!-- partial:close-dialog-button -->
      </header>
      <!-- Older and newer workouts on either side of the day shown, so the arrows stay put whatever the day holds. -->
      <div class="grid grid-cols-[auto_1fr_auto] items-center gap-2 mb-4">
        <button
          id="last-set-older"
          type="button"
          class="last-set-step border border-neutral-600/50 p-2 rounded-xl text-neutral-400 hover:text-white hover:bg-neutral-700 transition-colors duration-200 disabled:opacity-30 disabled:pointer-events-none"
          aria-label="Older workout"
          disabled
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
          </svg>
        </button>
        <p id="last-set-day" class="text-center leading-tight" aria-live="polite">
          <span id="last-set-date" class="block font-semibold"></span>
          <span id="last-set-gym" class="text-sm text-jim-neutral-secondary font-medium"></span>
        </p>
        <button
          id="last-set-newer"
          type="button"
          class="last-set-step border border-neutral-600/50 p-2 rounded-xl text-neutral-400 hover:text-white hover:bg-neutral-700 transition-colors duration-200 disabled:opacity-30 disabled:pointer-events-none"
          aria-label="Newer workout"
          disabled
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      </div>
      <div id="last-set-list" class="set-list">
        <!-- Completed sets will be rendered here -->
      </div>
    </dialog>

    <dialog
      id="exercise-history-dialog"
      class="w-[95dvw] h-[95dvh] sm:w-[80dvw] sm:h-[80dvh] max-w-none max-h-none m-auto overflow-hidden rounded-xl p-3 sm:p-4 force-landscape-in-portrait dialog-fade-in"
    >
      <div class="h-full w-full flex flex-col">
        <!-- One row for the title, the metrics and the close button, so the chart gets the rest of the short side. -->
        <header class="flex items-center gap-3 shrink-0">
          <h2 class="text-lg font-bold exercise-history-title truncate">
            <span>Exercise History</span>
          </h2>
          <ul class="flex flex-wrap justify-center gap-x-1 grow text-sm" aria-label="Lines">
            <li>
              <button type="button" class="history-metric" data-dataset="0" aria-pressed="true">
                <span class="history-metric-swatch bg-blue-500"></span>Average weight
              </button>
            </li>
            <li>
              <button type="button" class="history-metric" data-dataset="1" aria-pressed="true">
                <span class="history-metric-swatch bg-emerald-500"></span>Estimated 1RM
              </button>
            </li>
            <li>
              <button type="button" class="history-metric" data-dataset="2" aria-pressed="true">
                <span class="history-metric-swatch bg-violet-500"></span>Total volume
              </button>
            </li>
          </ul>
          <!-- partial:close-dialog-button -->
        </header>
        <div class="flex-1 min-h-0 w-full relative">
          <canvas id="exercise-history-chart"></canvas>
        </div>
        <ul
          id="exercise-history-gyms"
          class="shrink-0 flex flex-wrap justify-center gap-x-4 gap-y-1 mt-1 text-sm text-jim-neutral-secondary"
          aria-label="Gyms"
          hidden
        ></ul>
      </div>
    </dialog>

    <dialog id="add-exercise-dialog" class="w-full h-full">
      <header class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold focus:outline-none" tabindex="-1" autofocus>Add exercise</h2>
        <!-- partial:close-dialog-button -->
      </header>
