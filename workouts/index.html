<!doctype html>
<html lang="en">
  <head>
    <!-- partial:head -->
    <title>Jimbro - Workouts</title>
  </head>
  <body class="app">
    <div class="app-page pb-20 md:pb-0">
      <header class="app-header">
        <!-- partial:back-button -->
        <h1 class="app-header-title">Workouts</h1>
        <button id="new-workout-btn" class="link-primary ml-auto items-center flex" aria-label="Add new workout">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          New
        </button>
      </header>
      <div class="app-page-content">
        <div id="intro" class="text-center text-balance text-lg bg-jim-dark-blue p-4 rounded-lg mb-4" hidden>
          <!-- Intro text will be rendered here -->
        </div>
        <button
          id="week-progress"
          type="button"
          class="card week-progress light-haptic mb-4"
          aria-haspopup="dialog"
          hidden
        >
          <span class="flex items-center gap-2 text-sm text-neutral-400">
            <svg
              class="mode-icon"
              data-mode="rotation"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"
              />
            </svg>
            <svg
              class="mode-icon"
              data-mode="freestyle"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 7.5h3.5c4 0 5 9 9 9H21m0 0-2.5-2.5M21 16.5 18.5 19M3 16.5h3.5c1.6 0 2.7-1.4 3.6-3M21 7.5h-5.5c-1.6 0-2.7 1.4-3.6 3M21 7.5 18.5 5M21 7.5 18.5 10"
              />
            </svg>
            <span id="workout-mode-name" class="font-semibold text-neutral-200"><!-- --></span>
            <span id="workout-mode-rule" class="ml-auto"><!-- --></span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="size-3.5"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
          </span>
          <span id="week-progress-count" class="text-xl font-bold text-neutral-200"><!-- --></span>
          <span id="week-progress-goal" class="week-goal" aria-hidden="true"></span>
          <span id="week-progress-note" class="text-sm text-neutral-400"><!-- --></span>
        </button>
        <div id="workout-weeks" class="fills-in flex flex-col gap-6">
          <!-- Workout weeks will be rendered here -->
        </div>
        <template id="workout-week-template">
          <div class="workout-week">
            <h2 class="workout-week-title text-xl font-bold mb-2">
              <span class="workout-week-week text-jim-accent">
                <!-- -->
              </span>
              <span class="workout-week-year text-jim-primary/60">
                <!-- -->
              </span>
            </h2>
            <ul class="workout-week-list grid gap-2 items-stretch">
              <!-- Workout items will be rendered here -->
            </ul>
          </div>
        </template>
        <template id="open-slot-template">
          <li>
            <button type="button" class="open-slot light-haptic" aria-label="Start a workout">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.8"
                stroke="currentColor"
                class="size-6"
                aria-hidden="true"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
              <span class="open-slot-label text-xs" aria-hidden="true">Start</span>
            </button>
          </li>
        </template>
        <template id="workout-item-template">
          <li>
            <div class="card h-full p-4 justify-between flex flex-col with-bg gap-1 light-haptic">
              <h2 class="workout-title text-sm font-bold mb-2">
                <!-- -->
              </h2>
              <div class="flex flex-col gap-1">
                <p class="workout-status text-sm text-jim-neutral-tertiary">
                  <!-- -->
                </p>
                <p class="workout-date text-xs text-jim-neutral-secondary">
                  <!-- -->
                </p>
              </div>
            </div>
          </li>
        </template>
      </div>
    </div>

    <dialog id="new-workout-dialog">
      <header class="flex justify-between items-center mb-4">
        <h2 id="dialog-title" class="text-xl font-bold">Select program</h2>
        <!-- partial:close-dialog-button -->
      </header>
      <ul id="programs-list" class="grid grid-cols-1 md:grid-cols-3 gap-2 items-stretch">
        <!-- Programs will be rendered here -->
      </ul>
      <div class="flex gap-3 justify-end mt-6">
        <button type="button" id="dialog-cancel" class="btn-secondary">Cancel</button>
      </div>
      <template id="program-item-template">
        <li>
          <a class="program-link" href="#">
            <div class="card h-full p-4 justify-between flex flex-col card-simple">
              <h3 class="program-name card-title">
                <!-- -->
              </h3>
              <p class="this-week-status">
                <!-- -->
              </p>
              <p class="last-completed-date text-sm text-neutral-400">
                <!-- -->
              </p>
            </div>
          </a>
        </li>
      </template>
    </dialog>

    <dialog id="workout-mode-dialog">
      <header class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Workout Mode</h2>
        <!-- partial:close-dialog-button -->
      </header>
      <div class="flex flex-col gap-4">
        <fieldset>
          <legend class="text-jim-neutral-secondary text-sm font-semibold mb-2">Mode</legend>
          <div class="flex gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="workout-mode" value="rotation" class="accent-jim-accent" />
              <span>Rotation</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="workout-mode" value="freestyle" class="accent-jim-accent" />
              <span>Freestyle</span>
            </label>
          </div>
        </fieldset>
        <div id="weekly-goal-container" class="hidden">
          <label class="text-jim-neutral-secondary">
            Weekly workout goal
            <input type="number" id="weekly-goal-input" min="1" max="7" value="3" class="mt-2" />
          </label>
        </div>
        <p id="workout-mode-description" class="text-sm text-jim-neutral-tertiary"></p>
      </div>
    </dialog>

    <!-- partial:bottom-nav -->
    <script type="module" src="/src/pages/workouts/index.ts"></script>
  </body>
</html>
