<!doctype html>
<html lang="en">
  <head>
    <!-- partial:head -->
    <title>Jimbro - Settings</title>
    <script type="module" src="/src/pages/settings/index.ts"></script>
  </head>
  <body class="app">
    <!-- Icons: Lucide (https://lucide.dev), timer, cloud, bot and database, inlined. ISC License. -->
    <div class="app-page pb-20 md:pb-0">
      <header class="app-header">
        <!-- partial:back-button -->
        <h1 class="app-header-title">Settings</h1>
      </header>

      <div class="app-page-content">
        <div class="flex flex-col gap-6">
          <section aria-labelledby="workout-group">
            <h2 id="workout-group" class="settings-group-title">Workout</h2>
            <div class="settings-list">
              <div class="settings-row">
                <span class="settings-icon">
                  <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">
                    <line x1="10" x2="14" y1="2" y2="2" />
                    <line x1="12" x2="15" y1="14" y2="11" />
                    <circle cx="12" cy="14" r="8" />
                  </svg>
                </span>
                <span class="settings-row-label" id="break-time-label">
                  Break time
                  <span class="settings-row-detail">Between sets</span>
                </span>
                <div class="stepper" role="group" aria-labelledby="break-time-label">
                  <button type="button" id="break-time-less" aria-label="15 seconds less">−</button>
                  <output id="break-time" aria-live="polite"></output>
                  <button type="button" id="break-time-more" aria-label="15 seconds more">+</button>
                </div>
              </div>
            </div>
          </section>

          <section aria-labelledby="account-group">
            <h2 id="account-group" class="settings-group-title">Account</h2>
            <div class="settings-list">
              <a class="settings-row" href="/settings/backup/">
                <span class="settings-icon settings-icon-blue">
                  <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
                  </svg>
                </span>
                <span class="settings-row-label">
                  Cloud backup
                  <span id="cloud-summary-status" class="settings-row-detail"></span>
                </span>
                <!-- partial:chevron-right -->
              </a>
              <a class="settings-row" href="/settings/assistants/">
                <span class="settings-icon settings-icon-violet">
                  <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 8V4H8" />
                    <rect width="16" height="12" x="4" y="8" rx="2" />
                    <path d="M2 14h2" />
                    <path d="M20 14h2" />
                    <path d="M15 13v2" />
                    <path d="M9 13v2" />
                  </svg>
                </span>
                <span class="settings-row-label">
                  AI assistants
                  <span id="assistants-summary" class="settings-row-detail"></span>
                </span>
                <!-- partial:chevron-right -->
              </a>
            </div>
          </section>

          <section aria-labelledby="data-group">
            <h2 id="data-group" class="settings-group-title">Data</h2>
            <div class="settings-list">
              <a class="settings-row" href="/settings/data/">
                <span class="settings-icon settings-icon-grey">
                  <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">
                    <ellipse cx="12" cy="5" rx="9" ry="3" />
                    <path d="M3 5V19A9 3 0 0 0 21 19V5" />
                    <path d="M3 12A9 3 0 0 0 21 12" />
                  </svg>
                </span>
                <span class="settings-row-label">
                  Data on this phone
                  <span class="settings-row-detail">Export, import or reset</span>
                </span>
                <!-- partial:chevron-right -->
              </a>
            </div>
          </section>
        </div>

        <p id="app-version" class="page-foot" hidden>
          Version <a id="app-version-commit" class="underline" target="_blank" rel="noopener"></a>
          <span id="app-version-date"></span>
        </p>
      </div>
    </div>

    <!-- partial:break-timer -->
    <!-- partial:bottom-nav -->
  </body>
</html>
