<!doctype html>
<html lang="en">
  <head>
    <!-- partial:head -->
    <title>Jimbro - Programs</title>
    <script type="module" src="/src/pages/programs/index.ts"></script>
  </head>
  <body class="app">
    <div class="app-page pb-20 md:pb-0">
      <header class="app-header">
        <h1 class="app-header-title">Programs</h1>
        <button id="new-program-btn" class="link-primary ml-auto font-semibold">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          New
        </button>
      </header>
      <div class="app-page-content">
        <ul id="programs-grid" class="fills-in grid grid-cols-1 md:grid-cols-2 gap-3">
          <!-- Programs will be rendered here -->
        </ul>
        <template id="program-item-template">
          <li>
            <a class="program-card">
              <span class="program-card-main">
                <span class="program-name card-title"><!-- --></span>
                <span class="program-summary"><!-- --></span>
                <span class="program-muscles"></span>
              </span>
              <!-- partial:chevron-right -->
            </a>
          </li>
        </template>
      </div>
    </div>

    <dialog id="new-program-dialog" aria-labelledby="new-program-title">
      <header>
        <h2 id="new-program-title" class="text-xl font-bold">New program</h2>
        <!-- partial:close-dialog-button -->
      </header>
      <form id="new-program-form" class="flex flex-col gap-6">
        <div>
          <label for="new-program-name">Name</label>
          <input
            type="text"
            id="new-program-name"
            name="name"
            required
            autofocus
            class="w-full p-2 rounded border border-neutral-600"
          />
        </div>
        <div class="flex justify-end">
          <button type="submit" class="btn-primary">Create</button>
        </div>
      </form>
    </dialog>

    <!-- partial:break-timer -->
    <!-- partial:bottom-nav -->
  </body>
</html>
