<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jimbro</title>
    <link rel="icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/app.webmanifest" />
    <!-- Chromium prerenders the other bottom-nav pages, so tapping one shows it complete at once. -->
    <script type="speculationrules">
      {
        "prerender": [
          { "where": { "selector_matches": ".bottom-nav a:not([aria-current])" }, "eagerness": "immediate" }
        ]
      }
    </script>
  </head>
  <body class="app">
    <div class="app-page pb-20 md:pb-0">
      <header class="app-header">
        <h1 class="app-header-title">Hey, gymbro.</h1>
        <a href="/settings/" class="link-primary ml-auto">Settings</a>
      </header>
      <div class="app-page-content items-center justify-center relative">
        <div class="absolute top-4 right-4">
          <button id="install-btn" class="btn-secondary flex items-center gap-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"
              />
            </svg>
            Install app
          </button>
        </div>
        <a class="btn-primary text-lg" href="/workouts/"> Start workout </a>
      </div>
    </div>
    <nav class="bottom-nav fixed bottom-0 left-0 right-0 md:max-w-2xl md:mx-auto z-50">
      <div class="flex justify-around items-center h-20 px-2">
        <a
          href="/"
          aria-current="page"
          class="nav-link flex flex-col items-center justify-center flex-1 h-full hover:text-blue-400 transition-all duration-200"
        >
          <span class="text-2xl mb-1">🏠</span>
          <span class="text-xs font-medium">Home</span>
        </a>
        <a
          href="/workouts/"
          class="nav-link flex flex-col items-center justify-center flex-1 h-full text-neutral-400 hover:text-blue-400 transition-all duration-200"
        >
          <span class="text-2xl mb-1">💪</span>
          <span class="text-xs font-medium">Workouts</span>
        </a>
        <a
          href="/exercises/"
          class="nav-link flex flex-col items-center justify-center flex-1 h-full text-neutral-400 hover:text-blue-400 transition-all duration-200"
        >
          <span class="text-2xl mb-1">📋</span>
          <span class="text-xs font-medium">Exercises</span>
        </a>
        <a
          href="/programs/"
          class="nav-link flex flex-col items-center justify-center flex-1 h-full text-neutral-400 hover:text-blue-400 transition-all duration-200"
        >
          <span class="text-2xl mb-1">📝</span>
          <span class="text-xs font-medium">Programs</span>
        </a>
        <a
          href="/stats/"
          class="nav-link flex flex-col items-center justify-center flex-1 h-full text-neutral-400 hover:text-blue-400 transition-all duration-200"
        >
          <span class="text-2xl mb-1">📊</span>
          <span class="text-xs font-medium">Stats</span>
        </a>
      </div>
    </nav>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/navigation.ts"></script>
    <script type="module" src="/src/features/hapticFeedback/index.ts"></script>
  </body>
</html>
