<!doctype html>
<html lang="en">
  <head>
    <!-- partial:head -->
    <title>Jimbro</title>
    <script type="module" src="/src/pages/home/index.ts"></script>
  </head>
  <body class="app">
    <div class="app-page md:pb-0">
      <header class="app-header">
        <!-- In the Christmas season (src/features/season.ts) the greeting is "Ho ho ho" and the H wears a Santa hat,
             which a tap knocks off in a puff of snow. -->
        <div class="relative">
          <h1 class="app-header-title"><span id="greeting">Hey</span>, gymbro.</h1>
          <button id="santa-hat" type="button" class="santa-hat" aria-label="Knock off the Santa hat" hidden>
            <svg viewBox="0 0 60 50" aria-hidden="true">
              <path d="M6 38C10 18 24 4 40 6c8 1 12 8 11 18-3-6-8-9-14-8C27 18 20 28 18 40z" fill="#d93a3a" />
              <path d="M6 38C10 18 24 4 40 6c-10 4-16 16-18 34z" fill="#b3261f" opacity=".55" />
              <rect x="2" y="36" width="36" height="11" rx="5.5" fill="#f4f6f8" />
              <circle cx="51" cy="26" r="6.5" fill="#f4f6f8" />
            </svg>
          </button>
        </div>
        <a href="/settings/" class="link-primary ml-auto">Settings</a>
      </header>
      <main class="app-page-content gap-5">
        <section class="card flex flex-col gap-3 py-4" aria-labelledby="week-heading">
          <div class="flex items-baseline justify-between">
            <h2 id="week-heading" class="home-eyebrow">This week</h2>
            <p id="week-count" class="text-sm text-neutral-400"></p>
          </div>
          <div id="week-goal" class="week-goal" aria-hidden="true"></div>
          <ol id="week-days" class="week-days fills-in"></ol>
          <p id="week-carry" class="text-xs text-neutral-400 -mt-1" hidden></p>
        </section>

        <!-- Advent of gains, from Dec 1 to Dec 26 in the Christmas season: a door for each day up to Christmas Eve,
             which a workout that day opens (src/pages/home/advent.ts). -->
        <section id="advent" class="card advent flex flex-col gap-3 py-4" aria-labelledby="advent-heading" hidden>
          <div class="flex items-baseline justify-between">
            <h2 id="advent-heading" class="home-eyebrow advent-eyebrow">Advent of gains</h2>
            <p id="advent-count" class="text-sm text-neutral-400"></p>
          </div>
          <ol id="advent-doors" class="advent-doors"></ol>
          <p id="advent-note" class="text-sm text-neutral-400"></p>
        </section>

        <ul id="highlights" class="highlights fills-in" aria-label="Highlights" hidden>
          <li>
            <a class="highlight" href="/stats/">
              <span id="streak-value" class="highlight-value"></span>
              <span id="streak-label" class="highlight-label"></span>
            </a>
          </li>
          <li>
            <a class="highlight" href="/stats/">
              <span id="volume-value" class="highlight-value"></span>
              <span class="highlight-label">lifted this week</span>
              <span id="volume-delta" class="highlight-detail"></span>
            </a>
          </li>
          <li>
            <a class="highlight" href="/stats/">
              <span id="records-value" class="highlight-value"></span>
              <span class="highlight-label">this week</span>
              <span id="records-detail" class="highlight-detail"></span>
            </a>
          </li>
        </ul>

        <section id="picks" class="flex flex-col gap-2" aria-labelledby="picks-heading">
          <h2 id="picks-heading" class="home-eyebrow">Pick your workout</h2>
          <ul id="program-picks" class="flex flex-col gap-2 fills-in"></ul>
        </section>

        <div id="first-steps" class="flex flex-1 flex-col items-center justify-center gap-4 text-center" hidden>
          <p class="text-lg text-neutral-300">Let's set up your first workout.</p>
          <a class="btn-primary text-lg" href="/workouts/">Get started</a>
        </div>

        <div id="install-row" class="install-row mt-auto">
          <span>Install Jimbro for quick access</span>
          <button id="install-btn" type="button" class="btn-secondary px-4 py-2 ml-auto">Install</button>
        </div>
      </main>
    </div>

    <template id="week-day-template">
      <li class="week-day">
        <span class="week-day-dot" aria-hidden="true"></span>
        <span class="week-day-name" aria-hidden="true"></span>
        <span class="week-day-label sr-only"></span>
      </li>
    </template>

    <!-- What was behind an open advent door: a fun fact from that day's workout. -->
    <dialog id="advent-door-dialog" class="dialog-sheet" aria-labelledby="advent-door-title">
      <!-- partial:sheet-grabber -->
      <header class="dialog-sheet-header">
        <div class="flex items-center gap-4">
          <span class="advent-present advent-present-large" aria-hidden="true"></span>
          <div>
            <p id="advent-door-day" class="home-eyebrow advent-eyebrow"></p>
            <h2
              id="advent-door-title"
              class="text-xl font-bold text-white focus:outline-none"
              tabindex="-1"
              autofocus
            ></h2>
          </div>
        </div>
      </header>
      <div class="dialog-sheet-body flex flex-col gap-2 pb-6">
        <p id="advent-door-line" class="text-lg text-jim-neutral"></p>
        <p id="advent-door-detail" class="text-sm text-neutral-400"></p>
      </div>
    </dialog>

    <!-- partial:program-pick -->
    <!-- partial:break-timer -->
    <!-- partial:bottom-nav -->
  </body>
</html>
