<!doctype html>
<html lang="en">
  <head>
    <!-- partial:head -->
    <title>Jimbro</title>
  </head>
  <body class="app">
    <div class="app-page pb-20 md:pb-0">
      <header class="app-header">
        <h1 class="app-header-title">Hey, gymbro.</h1>
        <a href="/settings/" class="link-primary ml-auto">Settings</a>
      </header>
      <main class="app-page-content gap-5">
        <section class="card flex flex-col gap-3 py-4" aria-labelledby="week-heading">
          <div class="flex items-baseline justify-between">
            <h2 id="week-heading" class="home-eyebrow">This week</h2>
            <p id="week-count" class="text-sm text-neutral-400"></p>
          </div>
          <div id="week-goal" class="week-goal" aria-hidden="true"></div>
          <ol id="week-days" class="week-days fills-in"></ol>
        </section>

        <ul id="highlights" class="highlights fills-in" aria-label="Highlights" hidden>
          <li class="highlight">
            <span id="streak-value" class="highlight-value"></span>
            <span id="streak-label" class="highlight-label"></span>
          </li>
          <li class="highlight">
            <span id="volume-value" class="highlight-value"></span>
            <span class="highlight-label">lifted this week</span>
            <span id="volume-delta" class="highlight-detail"></span>
          </li>
          <li class="highlight">
            <span id="records-value" class="highlight-value"></span>
            <span class="highlight-label">this week</span>
            <span id="records-detail" class="highlight-detail"></span>
          </li>
        </ul>

        <section class="flex flex-col gap-2" aria-labelledby="picks-heading">
          <h2 id="picks-heading" class="home-eyebrow">Pick your workout</h2>
          <ul id="program-picks" class="flex flex-col gap-2 fills-in"></ul>
          <p id="no-programs" class="flex flex-col items-start gap-3 text-neutral-300" hidden>
            You have no programs yet.
            <a class="btn-primary" href="/workouts/">Get started</a>
          </p>
        </section>

        <div id="install-row" class="install-row mt-auto">
          <span>Install Jimbro for quick access</span>
          <button id="install-btn" type="button" class="btn-secondary px-4 py-2 ml-auto">Install</button>
        </div>
      </main>
    </div>

    <template id="week-day-template">
      <li class="week-day">
        <span class="week-day-dot" aria-hidden="true"></span>
        <span class="week-day-name" aria-hidden="true"></span>
        <span class="week-day-label sr-only"></span>
      </li>
    </template>

    <template id="program-pick-template">
      <li>
        <a class="program-pick">
          <span class="program-pick-check" aria-hidden="true"></span>
          <span class="flex flex-col min-w-0">
            <span class="program-pick-name"></span>
            <span class="program-pick-meta"></span>
          </span>
          <span class="program-pick-action"></span>
        </a>
      </li>
    </template>
    <!-- partial:bottom-nav -->
    <script type="module" src="/src/pages/home/index.ts"></script>
  </body>
</html>
