name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - name: Install client dependencies
        run: vp install
      - name: Install worker dependencies
        run: cd worker && vp install

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - run: vp install
      - name: Typecheck client
        run: tsc --noEmit
      - run: cd worker && vp install
      - name: Typecheck worker
        run: cd worker && vp exec tsc --noEmit

  format:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - run: vp install
      - name: Check formatting
        run: |
          vp fmt
          git diff --exit-code || (echo "::error::Files not formatted. Run 'vp fmt' locally." && exit 1)

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - run: vp install
      - name: Lint
        run: vp lint

  unit-tests:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - run: vp install
      - name: Client unit tests
        run: vp test run
      - run: cd worker && vp install
      - name: Worker tests
        run: cd worker && vp run test

  e2e:
    name: e2e (${{ matrix.artifact }})
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
            artifact: chromium
          - project: webkit
            browser: webkit
            artifact: webkit
          - project: Mobile Safari
            browser: webkit
            artifact: mobile-safari
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - run: vp install
      - name: Install Playwright browsers
        run: vp exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright tests
        run: xvfb-run vp exec playwright test --project="${{ matrix.project }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: playwright-report/
          retention-days: 30

  e2e-tests:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every browser project passed
        run: test "${{ needs.e2e.result }}" = "success"
