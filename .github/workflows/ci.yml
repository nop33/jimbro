name: CI

on:
  push:
    branches: [main]
  # Every pull request, so a PR stacked on another branch gets the same checks as one on main.
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - name: Install client dependencies
        run: vp install
      - name: Install worker dependencies
        run: cd worker && vp install
      - name: Read the installed Playwright version
        id: playwright
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - run: vp install
      - name: Typecheck client
        run: vp run typecheck
      - run: cd worker && vp install
      - name: Typecheck worker
        run: cd worker && vp run typecheck

  format:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - run: vp install
      - name: Check formatting
        run: |
          vp fmt
          git diff --exit-code || (echo "::error::Files not formatted. Run 'vp fmt' locally." && exit 1)

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - run: vp install
      # The type-aware rules read worker/test through the worker's own packages, so without them its promises go unseen.
      - name: Install worker dependencies
        run: cd worker && vp install
      - name: Lint
        run: vp lint

  unit-tests:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - run: vp install
      - name: Client unit tests
        run: vp test run
      - run: cd worker && vp install
      - name: Worker tests
        run: cd worker && vp run test

  e2e:
    name: e2e (${{ matrix.artifact }})
    needs: install
    runs-on: ubuntu-latest
    # The Playwright image of the installed version ships its browsers and the system packages they need. Installing
    # them on the runner with `playwright install --with-deps` sometimes ran into the timeout below.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.install.outputs.playwright }}-noble
      # The job's own PID 1 is `tail`, which never reaps the processes a stopped wrangler leaves behind, so the test
      # worker's teardown would wait out its timeout. --init runs a PID 1 that reaps them.
      options: --init
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            artifact: chromium
          - project: webkit
            artifact: webkit
          - project: Mobile Safari
            artifact: mobile-safari
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - run: vp install
      - name: Install worker dependencies
        run: cd worker && vp install
      - name: Run Playwright tests
        run: xvfb-run vp exec playwright test --project="${{ matrix.project }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: playwright-report/
          retention-days: 30

  e2e-tests:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every browser project passed
        run: test "${{ needs.e2e.result }}" = "success"
