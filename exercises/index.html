<!doctype html>
<html lang="en">
  <head>
    <!-- partial:head -->
    <title>Jimbro - Exercises</title>
    <script type="module" src="/src/pages/exercises/index.ts"></script>
  </head>
  <body class="app">
    <div class="app-page md:pb-0">
      <header class="app-header">
        <h1 class="app-header-title">Exercises</h1>
        <button id="new-exercise-btn" class="link-primary ml-auto font-semibold">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          New
        </button>
      </header>
      <div class="app-page-content">
        <div class="mb-6">
          <label for="muscle-filter">Filter by muscle group</label>
          <select id="muscle-filter">
            <!-- Muscle groups will be rendered here -->
          </select>
        </div>

        <div id="exercises-grid" class="fills-in grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Exercises will be rendered here -->
        </div>
        <template id="exercise-item-template">
          <div class="card card-hover">
            <header>
              <h3 class="exercise-name card-title">
                <!-- -->
              </h3>
              <div class="flex flex-col gap-1 items-end">
                <span class="exercise-muscle badge">
                  <!-- -->
                </span>
                <span class="exercise-kind badge bg-jim-accent text-neutral-900 hidden"> </span>
              </div>
            </header>
            <p class="exercise-prescription text-sm text-neutral-400 font-medium"></p>
          </div>
        </template>
      </div>
    </div>

    <dialog id="exercise-dialog" class="dialog-sheet" aria-labelledby="dialog-title">
      <!-- partial:sheet-grabber -->
      <header class="dialog-sheet-header">
        <h2 id="dialog-title" class="text-xl font-bold focus:outline-none" tabindex="-1">New Exercise</h2>
      </header>
      <form id="exercise-form" class="contents">
        <div class="dialog-sheet-body gap-5">
          <input type="hidden" id="exercise-id" name="id" />
          <div>
            <label for="exercise-name">Name</label>
            <input type="text" id="exercise-name" name="name" required />
          </div>
          <fieldset>
            <legend>Kind</legend>
            <div id="exercise-kind" class="segmented"></div>
          </fieldset>
          <fieldset id="exercise-preset-field" class="hidden">
            <legend>Log as</legend>
            <div id="exercise-preset" class="segmented"></div>
          </fieldset>
          <div id="exercise-muscle-field">
            <label for="exercise-muscle">Muscle group</label>
            <select id="exercise-muscle" name="muscle" required>
              <!-- Muscle groups will be rendered here -->
            </select>
          </div>
          <fieldset>
            <legend>Each time</legend>
            <div id="exercise-defaults" class="settings-list">
              <div class="settings-row">
                <label for="exercise-sets" class="settings-row-label">Sets</label>
                <div class="stepper">
                  <button type="button" data-step="-1" aria-label="Sets down">−</button>
                  <input
                    type="number"
                    id="exercise-sets"
                    name="sets"
                    min="1"
                    step="1"
                    inputmode="numeric"
                    aria-label="Default sets"
                    required
                  />
                  <button type="button" data-step="1" aria-label="Sets up">+</button>
                </div>
              </div>
            </div>
          </fieldset>
        </div>
        <footer class="dialog-sheet-footer">
          <!-- partial:delete-button -->
          <button type="submit" class="btn-primary flex-1">Save</button>
        </footer>
      </form>
    </dialog>

    <!-- partial:break-timer -->
    <!-- partial:bottom-nav -->
  </body>
</html>
